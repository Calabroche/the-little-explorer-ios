name: iOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (iOS + watchOS Simulators)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: List available runtimes
        run: xcrun simctl list runtimes

      - name: Download watchOS Simulator runtime if missing
        run: |
          if ! xcrun simctl list runtimes | grep -q watchOS; then
            echo "watchOS runtime not present, downloading..."
            xcodebuild -downloadPlatform watchOS
          else
            echo "watchOS runtime already installed"
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build LittleExplorer (iOS Simulator)
        run: |
          set -o pipefail && xcodebuild \
            -project LittleExplorer.xcodeproj \
            -scheme LittleExplorer \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Build LittleExplorerWatch (watchOS Simulator)
        run: |
          set -o pipefail && xcodebuild \
            -project LittleExplorer.xcodeproj \
            -scheme LittleExplorerWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
